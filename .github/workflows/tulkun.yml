name: Update Tulkun

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tulkun:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate and publish Tulkun
        uses: PramudithaN/git-tulkun@v1
        with:
          login: ${{ github.repository_owner }}
          view: side
          canon: "false"
          commit: "true"
